<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfolio of Khanh Linh To, a Computer Science Engineer with production software-engineering experience and applied AI/ML projects across NLP/RAG, computer vision, deep learning, and LLM applications."
    />
    <meta name="author" content="Khanh Linh To" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#040910" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f6f8fb" />
    <link rel="canonical" href="https://khanh-linh-portfolio.vercel.app/" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta property="og:title" content="Khanh Linh To | AI Engineer &amp; Software Engineer" />
    <meta
      property="og:description"
      content="Portfolio of Khanh Linh To, a Computer Science Engineer with production software-engineering experience and applied AI/ML projects across NLP/RAG, computer vision, deep learning, and LLM applications."
    />
    <meta property="og:image" content="https://github.com/khanhlinhcode.png" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://khanh-linh-portfolio.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Khanh Linh To | AI Engineer &amp; Software Engineer</title>
    <script>
      (function () {
        try {
          var storedTheme = localStorage.getItem("portfolio-theme-v2");
          var preferredTheme =
            storedTheme === "dark" || storedTheme === "light"
              ? storedTheme
              : "dark";
          document.documentElement.dataset.theme = preferredTheme;
          document.documentElement.style.colorScheme = preferredTheme;
        } catch (error) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
